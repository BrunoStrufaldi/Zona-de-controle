[package]
name = "zona-de-controle"
version = "0.1.0"
description = "Zona de Controle — hub local-first de produtividade, sistema e finanças"
authors = ["Bruno Strufaldi"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# O sufixo `_lib` evita conflito de nomes entre o binário e a biblioteca no Windows.
name = "zona_de_controle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# SQLite embarcado (feature `bundled`): não depende de SQLite instalado no sistema.
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-notification = "2"
# Atualização do app, usada só pelo Rust (commands próprios; a janela não tem
# permissão do plugin). Endereço fixo em HTTPS no tauri.conf.json e instalador
# conferido pela assinatura (minisign) antes de instalar.
tauri-plugin-updater = "2"
# Leitura (somente) de CPU, memória, discos e processos. Só os módulos usados.
# Sem `component` (temperatura): no Windows ela vem do WMI, que exige
# administrador, e o módulo chama `CoInitializeSecurity` para o processo todo.
# Fixado na 0.36: a 0.37+ exige Rust ≥ 1.95 (o `rust-version` do projeto é 1.80).
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk"] }

# Dispositivos e bateria (somente leitura, só no Windows). `hidapi` com o backend
# nativo (Rust puro, sem compilar C): lista os receptores USB e, na 3.3b, lê a
# bateria dos modelos suportados. `windows-sys`: XInput (controles Xbox) e a
# propriedade de bateria Bluetooth que o próprio Windows mostra em Configurações.
# Na otimização, `Win32_Security*` e `Win32_System_Threading` só leem o SID do
# usuário atual (nome da pasta dele na Lixeira) e se o app está elevado;
# `Win32_UI_Shell` esvazia a Lixeira pela API do Windows (SHEmptyRecycleBinW).
# No Espaço em disco, `Win32_Storage_FileSystem` lista as pastas (CreateFileW só
# com FILE_LIST_DIRECTORY + GetFileInformationByHandleEx), sem abrir arquivos.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_XboxController", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.rust]
# O linker MSVC imprime "Criando biblioteca ... .lib" ao gerar o cdylib; é
# apenas informativo e não indica problema.
linker_messages = "allow"
