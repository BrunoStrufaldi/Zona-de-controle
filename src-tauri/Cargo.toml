[package]
name = "zona-de-controle"
version = "0.1.0"
description = "Zona de Controle — hub local-first de produtividade, sistema e finanças"
authors = ["Bruno Strufaldi"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# O sufixo `_lib` evita conflito de nomes entre o binário e a biblioteca no Windows.
name = "zona_de_controle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# SQLite embarcado (feature `bundled`): não depende de SQLite instalado no sistema.
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-notification = "2"
# Leitura (somente) de CPU, memória, discos e processos. Só os módulos usados.
# Sem `component` (temperatura): no Windows ela vem do WMI, que exige
# administrador, e o módulo chama `CoInitializeSecurity` para o processo todo.
# Fixado na 0.36: a 0.37+ exige Rust ≥ 1.95 (o `rust-version` do projeto é 1.80).
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.rust]
# O linker MSVC imprime "Criando biblioteca ... .lib" ao gerar o cdylib; é
# apenas informativo e não indica problema.
linker_messages = "allow"
