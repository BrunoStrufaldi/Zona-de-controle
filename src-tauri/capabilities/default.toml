# Capability da janela principal.
#
# Princípio do menor privilégio: nenhum plugin de acesso ao sistema (shell, fs,
# sql, http...) e nenhuma permissão `core:*` é concedida — o frontend só pode
# chamar os commands próprios do app listados abaixo e mostrar notificações
# (lembretes do calendário). Toda nova permissão deve vir com um comentário
# justificando o motivo.

identifier = "default"
description = "Permissões mínimas da janela principal do Zona de Controle"
windows = ["main"]

permissions = [
  # Leitura: nome, versão e caminho do banco local (tela Configurações > Sobre).
  "allow-get-app-info",

  # Leitura de preferências do app (tabela app_settings).
  "allow-list-settings",
  "allow-get-setting",

  # Escrita de preferências. Chave e valor são validados no Rust e cada
  # alteração gera um registro no log de auditoria.
  "allow-set-setting",

  # Leitura do log de auditoria (somente leitura; o log é append-only).
  "allow-list-audit-entries",

  # Backup do banco — listar os arquivos da pasta de backups (somente os com o
  # nome gerado pelo app) e criar uma cópia nova. Não há command que apague,
  # sobrescreva ou restaure arquivos; cada backup (ou falha) é auditado.
  "allow-list-database-backups",
  "allow-create-database-backup",

  # Monitor do sistema — leitura ao vivo de SO, CPU, memória, discos e
  # processos (via sysinfo, sem privilégios de administrador). Nada é gravado e
  # não existe command para encerrar processos ou alterar o sistema.
  "allow-get-system-info",
  "allow-get-system-snapshot",
  "allow-list-processes",

  # Diagnóstico — análise da leitura atual (somente leitura) e leitura dos limites.
  "allow-run-diagnostics",
  "allow-get-diagnostic-thresholds",

  # Diagnóstico — gravar os limites. Validados no Rust (faixas e atenção <
  # crítico) e auditados como alteração de configuração.
  "allow-set-diagnostic-thresholds",

  # Dispositivos — leitura das fontes, dos dispositivos com bateria e dos
  # mouses/teclados/headsets USB. Só lê (hidapi, XInput e a bateria Bluetooth que
  # o Windows informa); nada é enviado aos dispositivos.
  "allow-list-battery-providers",
  "allow-list-battery-devices",
  "allow-list-usb-input-devices",

  # Dispositivos — marcar um dispositivo USB como sem fio e o tipo dele. Só grava
  # a escolha no banco (tabela device_markings); cada alteração é auditada.
  "allow-set-device-marking",

  # Otimização — análise da limpeza (somente leitura). Lê nomes, tamanhos e
  # datas só nas pastas da allowlist (temporários do usuário, caches seguros e a
  # Lixeira do usuário), sem seguir links e sem pedir administrador. Os itens
  # encontrados ficam em memória para a listagem por página.
  "allow-scan-cleanup",
  "allow-list-cleanup-items",

  # Otimização — limpeza (DESTRUTIVA). A tela só envia quais origens limpar,
  # depois de uma confirmação que mostra o que será removido; os caminhos vêm
  # da última análise guardada no Rust, que é consumida (não roda duas vezes).
  # Cada arquivo é conferido de novo (dentro da pasta analisada, sem links no
  # caminho, mesmo tamanho e data); arquivos em uso ou alterados são pulados.
  # Recusa rodar como administrador ou com o navegador dono do cache aberto.
  # A Lixeira só é esvaziada se estiver igual à análise. Sucesso,
  # cancelamento e falha vão para o log de auditoria.
  "allow-run-cleanup",

  # Otimização — andamento da limpeza em curso e pedido de cancelamento (para
  # antes do próximo arquivo).
  "allow-get-cleanup-progress",
  "allow-cancel-cleanup",

  # Otimização — histórico das limpezas (somente leitura): os registros
  # `cleanup.executed` do log de auditoria e o total liberado.
  "allow-list-cleanup-history",

  # Espaço em disco — análise do que ocupa uma unidade (SOMENTE LEITURA). A tela
  # manda só a letra da unidade, que precisa estar na lista do monitor (nunca um
  # caminho). Lê nomes, tamanhos e datas pasta a pasta, sem abrir arquivos, sem
  # seguir links/junções e sem pedir administrador. O resultado fica só em
  # memória (a última análise) e é listado pasta a pasta. Andamento e
  # cancelamento só afetam a própria análise.
  "allow-scan-disk-usage",
  "allow-get-disk-usage-progress",
  "allow-cancel-disk-usage",
  "allow-get-disk-usage-scan",
  "allow-list-disk-usage-children",

  # Tarefas — leitura da lista (ativas e arquivadas), das tags e das categorias.
  "allow-list-tasks",
  "allow-list-archived-tasks",
  "allow-list-task-tags",
  "allow-list-task-categories",

  # Tarefas — escrita. Entradas validadas no Rust (título, datas, tags,
  # recorrência, checklist, categoria).
  "allow-create-task",
  "allow-update-task",
  "allow-move-task",
  "allow-set-checklist-item-done",

  # Tarefas — arquivar/restaurar. Reversível: só marca a data de arquivamento,
  # nenhum dado é apagado.
  "allow-archive-task",
  "allow-archive-completed-tasks",
  "allow-restore-task",

  # Categorias de tarefas — criar e editar (nome e cor validados no Rust).
  "allow-create-task-category",
  "allow-update-task-category",

  # Tarefas e categorias — exclusão definitiva. A interface exige confirmação
  # explícita e cada exclusão (ou falha) é registrada no log de auditoria.
  # Excluir uma categoria não exclui tarefas: elas ficam sem categoria.
  "allow-delete-task",
  "allow-delete-task-category",

  # Notas — leitura das notas, das pastas e do histórico de versões.
  "allow-list-notes",
  "allow-list-note-folders",
  "allow-list-note-versions",

  # Notas — escrita. Entradas validadas no Rust (título, tamanho, tags, data do
  # diário). Salvar pode guardar o texto anterior no histórico; restaurar uma
  # versão também guarda o texto atual antes, então nada se perde.
  "allow-create-note",
  "allow-update-note",
  "allow-set-note-favorite",
  "allow-restore-note-version",
  "allow-create-note-folder",
  "allow-rename-note-folder",

  # Notas e pastas — exclusão definitiva. A interface exige confirmação explícita
  # e cada exclusão (ou falha) é auditada. Excluir uma pasta não exclui notas.
  "allow-delete-note",
  "allow-delete-note-folder",

  # Rotinas — leitura das rotinas, hábitos, últimos dias e estatísticas.
  "allow-list-routines",

  # Rotinas — escrita. Entradas validadas no Rust. Remover um hábito numa edição
  # só encerra a validade dele a partir de hoje (o histórico é mantido). Marcar
  # hábitos só vale de hoje até 7 dias atrás, em dias da agenda.
  "allow-create-routine",
  "allow-update-routine",
  "allow-set-habit-done",

  # Rotinas — exclusão definitiva (com hábitos e histórico). A interface exige
  # confirmação explícita e cada exclusão (ou falha) é auditada.
  "allow-delete-routine",

  # Calendário — leitura das ocorrências de um intervalo (com as tarefas que
  # vencem nele, somente leitura).
  "allow-list-calendar",

  # Calendário — escrita. Entradas validadas no Rust (título, datas, horários,
  # repetição, lembrete). Mudar o início ou a repetição de uma série descarta as
  # alterações de ocorrências individuais; o descarte é auditado.
  "allow-create-calendar-event",
  "allow-update-calendar-event",
  "allow-update-event-occurrence",

  # Calendário — exclusão definitiva da série ou de uma ocorrência. A interface
  # exige confirmação explícita e cada exclusão (ou falha) é auditada.
  "allow-delete-calendar-event",
  "allow-delete-event-occurrence",

  # Lembretes — devolve os lembretes vencidos e os marca como avisados (só
  # grava o registro de envio, para não repetir a notificação).
  "allow-claim-due-reminders",

  # Finanças — leitura das contas (com saldo), categorias, lançamentos de um
  # período (até um ano), tags em uso e do resumo do mês.
  "allow-list-finance-accounts",
  "allow-list-finance-categories",
  "allow-list-transactions",
  "allow-list-transaction-tags",
  "allow-get-finance-overview",
  # Analytics (somente leitura): receita x despesas, categorias e patrimônio
  # mês a mês, calculados no Rust.
  "allow-get-finance-analytics",
  # Projeção (somente leitura): saldo previsto dos próximos meses, com os
  # valores conhecidos e a estimativa separados, calculada no Rust.
  "allow-get-finance-projection",

  # Finanças — escrita. Entradas validadas no Rust (nome, valor em centavos
  # maior que zero, data, conta existente, categoria do mesmo tipo, tags).
  "allow-create-finance-account",
  "allow-update-finance-account",
  "allow-create-finance-category",
  "allow-update-finance-category",
  "allow-create-transaction",
  "allow-update-transaction",
  "allow-set-transaction-status",

  # Finanças — exclusão definitiva de lançamento, categoria (os lançamentos
  # ficam sem categoria) ou conta (só se não tiver lançamentos). A interface
  # exige confirmação explícita e cada exclusão (ou falha) é auditada.
  "allow-delete-transaction",
  "allow-delete-finance-category",
  "allow-delete-finance-account",

  # Finanças — importação de extratos em duas etapas. A prévia só lê o conteúdo
  # do arquivo que o usuário escolheu na tela (OFX do extrato ou CSV da fatura),
  # sem acesso ao sistema de arquivos e sem gravar nada. A importação recebe só
  # as escolhas por linha: valores, datas e identificadores vêm da leitura
  # guardada no Rust, linhas já importadas são puladas e cada importação (ou
  # falha) é auditada.
  "allow-preview-finance-import",
  "allow-commit-finance-import",

  # Finanças — recorrentes (contas fixas e receitas que se repetem). A leitura
  # calcula os vencimentos do período no Rust. As escritas validam no Rust
  # (valor, contas, categoria do mesmo tipo, regra de repetição) e só agem
  # sobre vencimentos em aberto da própria série: registrar cria o lançamento e
  # o vínculo numa transação; vincular exige lançamento do mesmo tipo e sem
  # outro vínculo; pular e reabrir não apagam lançamentos.
  "allow-list-recurring",
  "allow-create-recurring",
  "allow-update-recurring",
  "allow-register-recurring-occurrence",
  "allow-link-recurring-occurrence",
  "allow-skip-recurring-occurrence",
  "allow-reopen-recurring-occurrence",
  # Exclusão definitiva de uma recorrente: a interface exige confirmação
  # explícita, os lançamentos vinculados continuam e a exclusão (ou falha) é auditada.
  "allow-delete-recurring",

  # Finanças — parcelamentos (somente leitura): agrupa as parcelas das faturas
  # importadas e projeta as que faltam e as faturas dos próximos 12 meses.
  "allow-get-installments-overview",

  # Investimentos — leitura da carteira e do histórico de um ativo (somente leitura;
  # nenhuma cotação é baixada: o valor atual é sempre o informado pelo usuário).
  "allow-get-investments-overview",
  "allow-get-investment-asset",
  # Desempenho (somente leitura): resultado do período, evolução mensal e
  # vencimentos, calculados no Rust a partir dos valores informados.
  "allow-get-investments-performance",
  # Escritas validadas no Rust: ativo só em conta do tipo Investimentos;
  # movimentação com valor, data e quantidade válidos (com a conta, cria o
  # lançamento e o vínculo na mesma transação); vincular exige transferência
  # para/da conta do ativo ou entrada, sem outro vínculo; valores informados
  # substituem só o do mesmo dia.
  "allow-create-investment-asset",
  "allow-update-investment-asset",
  "allow-create-investment-movement",
  "allow-update-investment-movement",
  "allow-link-investment-transaction",
  "allow-set-investment-valuations",
  # Exclusões definitivas (ativo com o histórico, movimentação, valor informado):
  # a interface exige confirmação explícita, os lançamentos vinculados continuam
  # e a exclusão (ou falha) é auditada.
  "allow-delete-investment-asset",
  "allow-delete-investment-movement",
  "allow-delete-investment-valuation",

  # Plugin de notificação: só o necessário para mostrar os lembretes do
  # calendário como notificações do Windows (consultar/pedir permissão e
  # notificar). Sem agendamento, canais, ações ou listeners.
  "notification:allow-is-permission-granted",
  "notification:allow-request-permission",
  "notification:allow-notify",
]
