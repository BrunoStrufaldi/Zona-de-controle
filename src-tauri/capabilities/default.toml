# Capability da janela principal.
#
# Princípio do menor privilégio: nenhum plugin (shell, fs, sql, http...) e
# nenhuma permissão `core:*` é concedida — o frontend só pode chamar os
# commands próprios do app listados abaixo. Toda nova permissão deve vir com
# um comentário justificando o motivo.

identifier = "default"
description = "Permissões mínimas da janela principal do Zona de Controle"
windows = ["main"]

permissions = [
  # Leitura: nome, versão e caminho do banco local (tela Configurações > Sobre).
  "allow-get-app-info",

  # Leitura de preferências do app (tabela app_settings).
  "allow-list-settings",
  "allow-get-setting",

  # Escrita de preferências. Chave e valor são validados no Rust e cada
  # alteração gera um registro no log de auditoria.
  "allow-set-setting",

  # Leitura do log de auditoria (somente leitura; o log é append-only).
  "allow-list-audit-entries",

  # Backup do banco — listar os arquivos da pasta de backups (somente os com o
  # nome gerado pelo app) e criar uma cópia nova. Não há command que apague,
  # sobrescreva ou restaure arquivos; cada backup (ou falha) é auditado.
  "allow-list-database-backups",
  "allow-create-database-backup",

  # Leitura dos providers e dispositivos de bateria (sem escrita em dispositivos).
  "allow-list-battery-providers",
  "allow-list-battery-devices",

  # Leitura das categorias de limpeza previstas. NÃO há command de limpeza/exclusão.
  "allow-list-cleanup-categories",

  # Tarefas — leitura da lista (ativas e arquivadas), das tags e das categorias.
  "allow-list-tasks",
  "allow-list-archived-tasks",
  "allow-list-task-tags",
  "allow-list-task-categories",

  # Tarefas — escrita. Entradas validadas no Rust (título, datas, tags,
  # recorrência, checklist, categoria).
  "allow-create-task",
  "allow-update-task",
  "allow-move-task",
  "allow-set-checklist-item-done",

  # Tarefas — arquivar/restaurar. Reversível: só marca a data de arquivamento,
  # nenhum dado é apagado.
  "allow-archive-task",
  "allow-archive-completed-tasks",
  "allow-restore-task",

  # Categorias de tarefas — criar e editar (nome e cor validados no Rust).
  "allow-create-task-category",
  "allow-update-task-category",

  # Tarefas e categorias — exclusão definitiva. A interface exige confirmação
  # explícita e cada exclusão (ou falha) é registrada no log de auditoria.
  # Excluir uma categoria não exclui tarefas: elas ficam sem categoria.
  "allow-delete-task",
  "allow-delete-task-category",

  # Notas — leitura das notas, das pastas e do histórico de versões.
  "allow-list-notes",
  "allow-list-note-folders",
  "allow-list-note-versions",

  # Notas — escrita. Entradas validadas no Rust (título, tamanho, tags, data do
  # diário). Salvar pode guardar o texto anterior no histórico; restaurar uma
  # versão também guarda o texto atual antes, então nada se perde.
  "allow-create-note",
  "allow-update-note",
  "allow-set-note-favorite",
  "allow-restore-note-version",
  "allow-create-note-folder",
  "allow-rename-note-folder",

  # Notas e pastas — exclusão definitiva. A interface exige confirmação explícita
  # e cada exclusão (ou falha) é auditada. Excluir uma pasta não exclui notas.
  "allow-delete-note",
  "allow-delete-note-folder",

  # Rotinas — leitura das rotinas, hábitos, últimos dias e estatísticas.
  "allow-list-routines",

  # Rotinas — escrita. Entradas validadas no Rust. Remover um hábito numa edição
  # só encerra a validade dele a partir de hoje (o histórico é mantido). Marcar
  # hábitos só vale de hoje até 7 dias atrás, em dias da agenda.
  "allow-create-routine",
  "allow-update-routine",
  "allow-set-habit-done",

  # Rotinas — exclusão definitiva (com hábitos e histórico). A interface exige
  # confirmação explícita e cada exclusão (ou falha) é auditada.
  "allow-delete-routine",
]
